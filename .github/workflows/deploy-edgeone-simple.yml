name: Deploy to EdgeOne (Simple)

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

env:
  NODE_VERSION: '22'

jobs:
  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: |
          echo "🔨 Building frontend..."
          cd frontend
          npm install
          npm run build
          cd ..
          cp -r frontend/dist/* public/
          echo "✅ Frontend built successfully"

      - name: Prepare deployment
        run: |
          echo "📦 Preparing deployment package..."
          mkdir -p deploy
          cp -r public/* deploy/
          cp -r node-functions deploy/
          cp edgeone.config.js deploy/
          cp package.json deploy/
          echo "✅ Deployment package prepared"

      - name: Deploy to EdgeOne
        env:
          EDGEONE_HOST: ${{ secrets.EDGEONE_HOST }}
          EDGEONE_USER: ${{ secrets.EDGEONE_USER }}
          EDGEONE_KEY: ${{ secrets.EDGEONE_KEY }}
          EDGEONE_PROJECT_PATH: ${{ secrets.EDGEONE_PROJECT_PATH }}
        run: |
          echo "🚀 Deploying to EdgeOne..."
          
          # Create SSH config for EdgeOne
          mkdir -p ~/.ssh
          echo "$EDGEONE_KEY" > ~/.ssh/edgeone_key
          chmod 600 ~/.ssh/edgeone_key
          
          # Deploy using rsync over SSH
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/edgeone_key -o StrictHostKeyChecking=no" \
            deploy/ \
            ${EDGEONE_USER}@${EDGEONE_HOST}:${EDGEONE_PROJECT_PATH}
          
          echo "✅ Deployment completed!"

      - name: Cleanup
        run: |
          rm -rf deploy
          rm -rf ~/.ssh/edgeone_key
