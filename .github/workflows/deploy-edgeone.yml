# ⚠️ 此 Workflow 不适用于 EdgeOne Pages
# EdgeOne Pages 不支持 API 部署，仅支持 GitHub 连接自动部署或手动上传
# 建议使用前后端分离部署方案：
# - 前端：Cloudflare Pages（免费，构建内存充足）
# - 后端：EdgeOne Pages（边缘函数 + Turso/MySQL）
# 详见 DEPLOY_EDGEONE.md

name: ⚠️ Deprecated - EdgeOne Deployment

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Frontend
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: |
          cd frontend
          npm install
          npm run build
          cd ..
          cp -r frontend/dist/* public/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: public/
          retention-days: 7

  deploy:
    name: Deploy to EdgeOne (NOT WORKING)
    needs: build
    runs-on: ubuntu-latest
    
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: public/

      - name: ⚠️ EdgeOne Pages does not support API deployment
        run: |
          echo "❌ EdgeOne Pages 不支持 API 部署"
          echo "✅ 请使用以下替代方案："
          echo "   1. 前后端分离部署（推荐）"
          echo "   2. 本地构建后手动上传"
          echo ""
          echo "📖 详见 DEPLOY_EDGEONE.md"
          exit 1
